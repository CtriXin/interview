display_name: Interview
short_description: Propose a vetoable plan first; ask only the few questions that change the outcome, without turning the task into a heavy workshop.
default_prompt: Use Interview to clarify this request lightly. Prefer a vetoable proposal ("I will do A because X; veto if wrong") over questions; ask only when an answer changes the outcome. Inspect code/docs before asking, batch independent questions, recommend defaults, respect fatigue signals, check source-of-truth conflicts, test vague domain boundaries with scenarios, and stop once the next step is safe.
